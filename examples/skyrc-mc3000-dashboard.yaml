          - type: custom:apexcharts-card
            graph_span: 30min
            header:
              show: true
              title: SkyRC MC3000 Voltage Curves
              show_states: true
            apex_config:
              chart:
                animations:
                  enabled: false
                height: 420
                toolbar:
                  show: false
              stroke:
                width: 2
                curve: smooth
              markers:
                size: 0
              legend:
                show: true
                position: bottom
              xaxis:
                type: datetime
                title:
                  text: Curve time
              yaxis:
                title:
                  text: Voltage (V)
                decimalsInFloat: 3
                min: 1.20
                max: 1.65
              tooltip:
                shared: true
                x:
                  format: HH:mm:ss
            series:
              - entity: sensor.skyrc_mc3000_slot_1_voltage_curve_points
                name: Slot 1
                type: line
                data_generator: |
                  const samples = entity.attributes.samples_v || [];
                  const interval = entity.attributes.interval_seconds || 1;
                  const fetched = new Date(entity.attributes.last_fetched || Date.now()).getTime();
                  const values = samples
                    .map((value, index) => ({ value, index }))
                    .filter(point => point.value > 0)
                    .filter(point => {
                      const plotUntil = entity.attributes.plot_until_index;
                      return plotUntil === null || plotUntil === undefined || point.index <= plotUntil;
                    });
                  if (!values.length) return [];
                  const lastIndex = values[values.length - 1].index;
                  return values.map(point => [
                    fetched - ((lastIndex - point.index) * interval * 1000),
                    point.value
                  ]);
